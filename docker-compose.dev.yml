# Portafolio — desarrollo en Docker con recarga automática.
#   ./dev.sh up   → http://localhost:5900
name: portafolio-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: "${UID_DEV:-1000}"
        GID: "${GID_DEV:-1000}"
    image: portafolio-dev
    user: "${UID_DEV:-1000}:${GID_DEV:-1000}"
    ports:
      - "5900:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:5900
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm/store
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
  pnpm_store:
